<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Neon Flicker animation for WELLCOME">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Righteous&amp;display=swap');
      
      .neon-letter {
        filter: url(#glow);
        animation: flicker 2s infinite alternate;
      }
      
      @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { 
          opacity: 1; 
          filter: url(#glow); 
        }
        20%, 24%, 55% { 
          opacity: 0.4; 
          filter: none; 
        }
      }
    </style>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="300" fill="#0f172a"/>
  
  
